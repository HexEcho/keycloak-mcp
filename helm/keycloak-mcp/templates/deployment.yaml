apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keycloak-mcp.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "keycloak-mcp.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "keycloak-mcp.name" . }}
    spec:
      containers:
        - name: keycloak-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker,enterprise
            - name: KEYCLOAK_BASE_URL
              value: {{ .Values.config.keycloakBaseUrl | quote }}
            - name: MCP_ENFORCE_HTTP_JWT
              value: {{ .Values.streamableHttp.enforceJwt | quote }}
            - name: MCP_STREAMABLE_HTTP_ALLOWED_ORIGINS
              value: {{ .Values.streamableHttp.allowedOrigins | quote }}
            - name: MCP_STREAMABLE_HTTP_ALLOWED_HOSTS
              value: {{ .Values.streamableHttp.allowedHosts | quote }}
            - name: MCP_STREAMABLE_HTTP_REQUIRE_MTLS
              value: {{ .Values.streamableHttp.requireMtls | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "keycloak-mcp.fullname" . }}
                  key: client-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
          resources:
{{ toYaml .Values.resources | indent 12 }}
