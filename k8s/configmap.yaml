apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-mcp-config
data:
  keycloak-base-url: http://keycloak:8080
  mcp-enforce-http-jwt: "false"
  mcp-streamable-http-allowed-origins: https://mcp.example.com
  mcp-streamable-http-allowed-hosts: mcp.example.com,keycloak-mcp-server.default.svc.cluster.local
  mcp-streamable-http-require-mtls: "false"
